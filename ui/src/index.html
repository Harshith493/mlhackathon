<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PathSnap – Multi-Track Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>PathSnap – Map-Matching Demo</h1>
  </header>

  <section id="controls">
    <h2>Available Trips</h2>
    <div id="trip-list"><p>Loading trips…</p></div>
  </section>

  <section id="results" hidden>
    <h2>Evaluation Result</h2>
    <pre id="result-json"></pre>

    <h2>Map – Noisy (blue) vs Clean (red)</h2>
    <iframe id="map-frame"
            src=""
            width="100%"
            height="500"
            style="border:1px solid #aaa;">
      Your browser does not support iframes.
    </iframe>
  </section>

  <script src="main.js"></script>
</body>
</html>
